<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efd7cb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cafe Palmier" />
    <title>Cafe Palmier Tasks</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./Assets/app-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./Assets/app-icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./pwa.js" defer></script>
  </head>
  <body data-page="home">
    <header class="topbar">
      <a class="brand-wrap brand-home" href="./index.html" aria-label="Cafe Palmier Tasks home">
        <img class="brand-logo" src="./Assets/logo-eng.png" alt="Cafe Palmier logo" />
      </a>
      <nav class="nav">
        <a class="nav-link active" href="./index.html">Available Tasks</a>
        <a class="nav-link" href="./opening.html">Opening List</a>
        <a class="nav-link" href="./closing.html">Closing List</a>
        <a class="nav-link" href="./today.html">Today &amp; Tomorrow</a>
        <a class="nav-link" href="./tutorials.html">Tutorials</a>
      </nav>
    </header>

    <main class="page-shell">
      <section id="periodProgress" class="period-progress-grid" aria-label="Weekly, monthly, and yearly progress"></section>

      <section class="dashboard-available">
        <div id="taskGroups" class="task-groups"></div>
      </section>
    </main>

    <div id="completedModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-completed></div>
      <div class="modal-card">
        <div class="modal-header">
          <h2>Completed Tasks</h2>
          <button type="button" class="icon-btn" data-close-completed>Close</button>
        </div>
        <ul id="completedList" class="mini-list modal-list"></ul>
      </div>
    </div>

    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
