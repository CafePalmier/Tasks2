<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efd7cb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cafe Palmier" />
    <title>Cafe Palmier Admin</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/app-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/app-icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./pwa.js" defer></script>
  </head>
  <body data-page="admin">
    <header class="topbar">
      <a class="brand-wrap brand-home" href="./index.html" aria-label="Cafe Palmier Tasks home">
        <img class="brand-logo" src="./assets/logo-eng.png" alt="Cafe Palmier logo" />
      </a>
      <nav class="nav">
        <a class="nav-link" href="./index.html">Available Tasks</a>
        <a class="nav-link" href="./opening.html">Opening List</a>
        <a class="nav-link" href="./today.html">Today's List</a>
        <a class="nav-link" href="./closing.html">Closing List</a>
        <a class="nav-link active" href="./admin.html">Admin</a>
        <a class="nav-link" href="./tutorials.html">Tutorials</a>
      </nav>
    </header>

    <main class="page-shell admin-shell">
      <section class="panel-card form-panel">
        <h2 id="formTitle">Add a task</h2>
        <form id="taskForm">
          <input type="hidden" id="taskId" />

          <div class="field-grid">
            <label>
              <span>Title</span>
              <input type="text" name="title" required />
            </label>

            <label>
              <span>Category</span>
              <select name="category">
                <option value="opening">Opening</option>
                <option value="cleaning" selected>Cleaning</option>
                <option value="stocking">Stocking</option>
                <option value="prep">Prepping</option>
                <option value="closing">Closing</option>
                <option value="general">General</option>
              </select>
            </label>

            <label id="periodField">
              <span>Period</span>
              <select name="period">
                <option value="shift">Shift</option>
                <option value="weekly" selected>Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </label>

            <label>
              <span>Season</span>
              <select name="season">
                <option value="both" selected>Winter &amp; Summer</option>
                <option value="winter">Winter</option>
                <option value="summer">Summer</option>
              </select>
            </label>

            <label>
              <span data-time-tag-label>Time tag</span>
              <select name="timeTag"></select>
            </label>

            <div class="form-field urgent-days-field">
              <span>Urgent on</span>
              <details class="checkbox-dropdown" data-urgent-dropdown>
                <summary data-urgent-summary>No days selected</summary>
                <div class="checkbox-dropdown-menu">
                  <label><input type="checkbox" name="urgentOn" value="Monday" /><span>Monday</span></label>
                  <label><input type="checkbox" name="urgentOn" value="Tuesday" /><span>Tuesday</span></label>
                  <label><input type="checkbox" name="urgentOn" value="Wednesday" /><span>Wednesday</span></label>
                  <label><input type="checkbox" name="urgentOn" value="Thursday" /><span>Thursday</span></label>
                  <label><input type="checkbox" name="urgentOn" value="Friday" /><span>Friday</span></label>
                  <label><input type="checkbox" name="urgentOn" value="Saturday" /><span>Saturday</span></label>
                  <label><input type="checkbox" name="urgentOn" value="Sunday" /><span>Sunday</span></label>
                </div>
              </details>
            </div>
          </div>

          <div class="checklist-editor" data-checklist-editor>
            <span>Checklist</span>
            <div class="checklist-editor-layout">
              <div><div class="checklist-editor-items" data-checklist-editor-items></div><button type="button" class="secondary-btn checklist-add-item" data-add-checklist-item>+ Add checklist item</button></div>
              <div class="checklist-image-editor">
                <input type="hidden" name="checklistImage" />
                <label class="checklist-image-upload">Add reference image<input type="file" accept="image/*" data-checklist-image-input /></label>
                <div class="checklist-image-preview" data-checklist-image-preview hidden><img alt="Checklist reference preview" data-checklist-image-preview-image /><button type="button" class="icon-btn" data-remove-checklist-image>Remove</button></div>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-btn">Save task</button>
            <button type="button" class="secondary-btn" id="resetForm">Clear form</button>
          </div>
        </form>
      </section>

      <section class="panel-card">
        <div class="list-header">
          <h2>Task Library</h2>
        </div>
        <div id="adminTaskList" class="admin-task-list"></div>
      </section>
    </main>

    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
